# The controller node on a Raspberry Pi 4B (64-bit).
#
# Each supported board has a file here named after its MACHINE. setup.sh only accepts a board
# that has one, and has the build configuration require it, so this is where a board's
# controller-node settings go: which of its peripherals the controller node needs, and the
# board-specific way to turn them on. Board-independent settings belong in meta-artie.
#
# Everything below is read by meta-raspberrypi.

# UART
ENABLE_UART = "1"

# I2C
ENABLE_I2C = "1"
KERNEL_MODULE_AUTOLOAD:rpi += "i2c-dev i2c-bcm2708"

# CAN, over SPI through an MCP2515
ENABLE_SPI_BUS = "1"
ENABLE_CAN = "1"

# Needed for the Raspberry Pi Wi-Fi firmware
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
