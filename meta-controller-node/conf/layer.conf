# meta-controller-node: what an Artie controller node needs on top of meta-artie - its images,
# its packages, and how to turn on its peripherals on each supported board
# (conf/artie-boards/<MACHINE>.conf).

# We have conf and classes directories, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-controller-node-system"
BBFILE_PATTERN_meta-controller-node-system = "^${LAYERDIR}/"
# Above meta-artie's, so that the controller node can override common choices.
BBFILE_PRIORITY_meta-controller-node-system = "7"

# Board-specific appends, only parsed when that board's BSP layer is in the build. The part
# before the colon is the BSP layer's BBFILE_COLLECTIONS name.
BBFILES_DYNAMIC += " \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/*/*.bb \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/*/*.bbappend \
"

LAYERDEPENDS_meta-controller-node-system = "core artie"
LAYERSERIES_COMPAT_meta-controller-node-system = "scarthgap"
